<title>{{page.title}}</title>
    <meta name="description" content="{{page.description}}" />
    {{#if page.noindex}}<meta name="robots" content="noindex, follow" />{{else}}<meta name="robots" content="index, follow, max-image-preview:large" />{{/if}}
    <link rel="canonical" href="{{page.canonical}}" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta name="color-scheme" content="light" />
    <meta property="og:type" content="{{page.ogType}}" />
    <meta property="og:site_name" content="Qpdf" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:title" content="{{page.title}}" />
    <meta property="og:description" content="{{page.description}}" />
    <meta property="og:url" content="{{page.canonical}}" />
    <meta property="og:image" content="{{page.ogImage}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Qpdf — private PDF tools that run in your browser" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/images/qpdf-mark.svg" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    {{#if analyticsToken}}<meta name="qpdf-wa" content="{{analyticsToken}}" />{{/if}}
    {{#each page.jsonLd}}<script type="application/ld+json">{{{this}}}</script>
    {{/each}}
