<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {{> head }}
    <link href="/src/css/site.css" rel="stylesheet" />
  </head>
  <body>
    {{> navbar }}
    <main class="qp-wrap" style="padding-bottom: 3rem">
      <div class="qp-page-head">
        <h1>We couldn’t find that page</h1>
        <p>The link may be out of date. Search for a tool, or pick one of the popular ones below.</p>
      </div>
      <form action="/" method="get" class="qp-search" role="search" style="max-width: 560px">
        <i class="ph ph-magnifying-glass qp-search-icon" aria-hidden="true"></i>
        <label for="q404" class="sr-only">Search PDF tools</label>
        <input id="q404" name="q" type="search" placeholder="Search PDF tools" autocomplete="off" />
      </form>
      <div class="qp-section-title" style="margin-top: 2rem"><h2>Popular tools</h2><a class="qp-link" href="/tools/">All tools →</a></div>
      <div class="qp-grid">
        {{#each popular}}{{> tool-card }}{{/each}}
      </div>
    </main>
    {{> footer }}
  </body>
</html>
