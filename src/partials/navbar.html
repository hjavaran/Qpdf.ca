<a class="qp-skip" href="#main">Skip to content</a>
<header class="qp-header">
  <div class="qp-wrap">
    <div class="qp-header-inner">
      <a class="qp-brand" href="/" aria-label="Qpdf home">{{> logo-mark }}<span>Qpdf<span class="qp-brand-tld">.ca</span></span></a>
      <nav class="qp-nav" aria-label="Main">
        {{#each nav}}<a href="{{href}}" data-nav>{{label}}</a>{{/each}}
      </nav>
      <div class="qp-actions">
        <button type="button" class="qp-theme-btn" id="qp-theme-toggle" aria-label="Dark mode" aria-pressed="false" title="Toggle dark mode">
          <svg class="qp-ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="qp-ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" class="qp-menu-btn" aria-controls="qp-mobile-nav" aria-expanded="false" aria-label="Open menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
    <nav class="qp-mobile-nav" id="qp-mobile-nav" aria-label="Main (mobile)" hidden>
      {{#each nav}}<a href="{{href}}" data-nav>{{label}}</a>{{/each}}
    </nav>
  </div>
</header>
{{#if page.breadcrumbs}}{{#if tool}}<div class="qp-wrap" style="padding-top: 1rem">{{> breadcrumbs }}</div>{{/if}}{{/if}}
<span id="main" tabindex="-1"></span>
