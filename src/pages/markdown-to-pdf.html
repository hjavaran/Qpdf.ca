<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {{> head }}
    <link href="/src/css/styles.css" rel="stylesheet" />
    <link href="/src/css/markdown-editor.css" rel="stylesheet" />

    </head>

  <body class="antialiased bg-gray-900">
    {{> navbar }}

    <div class="min-h-screen py-8 px-4">
      <div class="max-w-7xl mx-auto">
        <div
          class="bg-gray-800 rounded-xl shadow-xl p-6 border border-gray-700"
        >
          <button
            id="back-to-tools"
            class="flex items-center gap-2 text-indigo-300 hover:text-indigo-400 mb-6 font-semibold"
          >
            <i data-lucide="arrow-left" class="cursor-pointer"></i>
            <span class="cursor-pointer" data-i18n="tools.backToTools"
              >Back to Tools</span
            >
          </button>

          <h1
            class="text-2xl font-bold text-white mb-2"
          >{{tool.name}}</h1>
          <p
            class="text-gray-400 mb-6"
            data-i18n="tools:markdownToPdf.subtitle"
          >
            Write or paste Markdown and export it as a beautifully formatted
            PDF.
          </p>

          <!-- Editor container -->
          <div id="markdown-editor-container"></div>
        </div>
      </div>
    </div>

    {{> tool-landing }}

    {{> footer }}

    <script type="module" src="/src/js/utils/lucide-init.ts"></script>
    <script type="module" src="/src/js/utils/full-width.ts"></script>
    <script type="module" src="/src/js/logic/markdown-to-pdf-page.ts"></script>
    <script type="module" src="/src/js/mobileMenu.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>
  </body>
</html>
