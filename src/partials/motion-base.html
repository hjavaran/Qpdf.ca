<style>
/* Qpdf motion graphics: shared frame, tokens and play-state gating.
   Original artwork; see src/partials/motion-*.html and src/js/qpdf/motion.ts.
   Static summary frame by default (no JS, reduced motion); animations attach
   only under [data-mo] and run only under [data-mo='play']. */
.qp-mo {
  --mo-frame: var(--qp-surface);
  --mo-page: #fff;
  --mo-page-edge: #cfccc4;
  --mo-page-line: #e2dfd8;
  --mo-page-title: #bdb9af;
  --mo-redact: #1b1b1e;
  --mo-stack: #f6f5f1;
  --mo-tray: var(--qp-surface-2);
  --mo-line: var(--qp-border-strong);
  --mo-dot: rgb(23 23 26 / 0.075);
  --mo-label: var(--qp-faint);
  --mo-soft: var(--qp-accent-soft);
  position: relative;
}
html[data-theme='dark'] .qp-mo {
  --mo-page: #2b2b30;
  --mo-page-edge: #4a4a52;
  --mo-page-line: #3e3e45;
  --mo-page-title: #55555e;
  --mo-redact: #050506;
  --mo-stack: #232327;
  --mo-dot: rgb(255 255 255 / 0.06);
  --mo-soft: rgb(255 125 137 / 0.07);
}
.qp-mo svg { display: block; }
.qp-mo .mo-stage svg { width: 100%; height: auto; }
.qp-mo .mo-stage svg * { vector-effect: non-scaling-stroke; }
.qp-mo .mo-frame {
  position: relative;
  border: 1px solid var(--qp-border);
  border-radius: 18px;
  background: var(--mo-frame);
  box-shadow: var(--qp-shadow-sm);
  overflow: hidden;
}
.qp-mo .mo-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  min-height: 2.75rem;
  padding: 0.55rem 1rem;
  border-bottom: 1px solid var(--qp-border);
  font-size: 0.75rem;
  line-height: 1.2;
  color: var(--mo-label);
  white-space: nowrap;
}
.qp-mo .mo-label {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}
.qp-mo .mo-stage { position: relative; }
.qp-mo .mo-dot { fill: var(--mo-dot); }
.qp-mo .mo-paper { fill: var(--mo-page); stroke: var(--mo-page-edge); }
.qp-mo .mo-fold { fill: none; stroke: var(--mo-page-edge); }
.qp-mo .mo-ttl { fill: var(--mo-page-title); }
.qp-mo .mo-ln { fill: var(--mo-page-line); }
.qp-mo .mo-tag { fill: var(--qp-accent); opacity: 0.85; }
.qp-mo .mo-red { fill: var(--mo-redact); transform-box: fill-box; transform-origin: left center; }
.qp-mo .mo-tray-f { fill: var(--mo-tray); stroke: var(--mo-line); }
.qp-mo .mo-tray-b { fill: var(--mo-stack); stroke: var(--mo-line); }
.qp-mo .mo-handle { fill: var(--mo-line); }
.qp-mo .mo-done circle { fill: var(--qp-ok); }
.qp-mo .mo-done path { fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
html[data-theme='dark'] .qp-mo .mo-done path { stroke: #0f1a13; }
.qp-mo .mo-done { transform-box: fill-box; transform-origin: center; }

/* Pause / play (added by motion.ts; hidden without JS and for reduced motion). */
.qp-mo .mo-toggle {
  position: absolute;
  top: calc(2.75rem + 0.5rem);
  right: 0.5rem;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 999px;
  border: 1px solid var(--qp-border);
  background: var(--mo-frame);
  color: var(--qp-muted);
  opacity: 0.75;
  cursor: pointer;
  transition: opacity 0.15s, color 0.15s, border-color 0.15s;
}
.qp-mo .mo-toggle:hover,
.qp-mo .mo-toggle:focus-visible { opacity: 1; color: var(--qp-ink); border-color: var(--qp-border-strong); }
.qp-mo .mo-toggle:focus-visible { outline: 2px solid var(--qp-accent); outline-offset: 2px; }
.qp-mo .mo-toggle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.qp-mo .mo-toggle .mo-i-play { fill: currentColor; }
.qp-mo .mo-toggle[data-paused='true'] .mo-i-pause,
.qp-mo .mo-toggle:not([data-paused='true']) .mo-i-play { display: none; }
.qp-mo .mo-toggle[hidden] { display: none; }

/* Animation gating: names are set per graphic; timing lives here. */
.qp-mo[data-mo] .mo-a {
  animation-duration: var(--mo-t, 12s);
  animation-iteration-count: infinite;
  animation-timing-function: cubic-bezier(0.45, 0, 0.2, 1);
  animation-fill-mode: both;
  animation-play-state: paused;
}
.qp-mo[data-mo='play'] .mo-a { animation-play-state: running; }
@media (prefers-reduced-motion: reduce) {
  .qp-mo .mo-a { animation: none !important; }
  .qp-mo .mo-toggle { display: none; }
}
</style>
<script type="module" src="/src/js/qpdf/motion.ts"></script>
