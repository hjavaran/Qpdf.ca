<div class="qp-card" data-tool="{{id}}" data-kw="{{kw}}">
  <span class="qp-card-icon" aria-hidden="true"><i class="ph {{icon}}"></i></span>
  <span class="min-w-0">
    <a class="qp-card-link qp-card-name" href="{{url}}">{{name}}</a>
    <span class="qp-card-desc">{{short}}</span>
  </span>
  <button type="button" class="qp-fav" data-fav="{{id}}" aria-pressed="false" aria-label="Add {{name}} to favourites" title="Favourite">{{> star-icon }}</button>
</div>
